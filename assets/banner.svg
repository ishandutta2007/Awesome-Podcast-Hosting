<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a">
        <animate attributeName="stop-color" values="#0f172a;#1e1b4b;#0f172a" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="50%" stop-color="#1e1b4b">
        <animate attributeName="stop-color" values="#1e1b4b;#311042;#1e1b4b" dur="8s" repeatCount="indefinite" />
      </stop>
      <stop offset="100%" stop-color="#030712">
        <animate attributeName="stop-color" values="#030712;#0f172a;#030712" dur="8s" repeatCount="indefinite" />
      </stop>
    </linearGradient>

    <!-- Accent Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <!-- Glowing Waves Gradient -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#ec4899" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 800; font-size: 50px; fill: url(#textGrad); }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 500; font-size: 20px; fill: #94a3b8; letter-spacing: 1px; }
    .tag { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 600; font-size: 14px; fill: #38bdf8; }
  </style>

  <!-- Background Rect -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Grid Pattern / Tech Dots -->
  <g opacity="0.15">
    <circle cx="100" cy="60" r="1.5" fill="#fff" />
    <circle cx="200" cy="60" r="1.5" fill="#fff" />
    <circle cx="300" cy="60" r="1.5" fill="#fff" />
    <circle cx="400" cy="60" r="1.5" fill="#fff" />
    <circle cx="500" cy="60" r="1.5" fill="#fff" />
    <circle cx="600" cy="60" r="1.5" fill="#fff" />
    <circle cx="700" cy="60" r="1.5" fill="#fff" />
    <circle cx="800" cy="60" r="1.5" fill="#fff" />
    <circle cx="900" cy="60" r="1.5" fill="#fff" />
    <circle cx="1000" cy="60" r="1.5" fill="#fff" />
    <circle cx="1100" cy="60" r="1.5" fill="#fff" />

    <circle cx="100" cy="180" r="1.5" fill="#fff" />
    <circle cx="200" cy="180" r="1.5" fill="#fff" />
    <circle cx="300" cy="180" r="1.5" fill="#fff" />
    <circle cx="400" cy="180" r="1.5" fill="#fff" />
    <circle cx="800" cy="180" r="1.5" fill="#fff" />
    <circle cx="900" cy="180" r="1.5" fill="#fff" />
    <circle cx="1000" cy="180" r="1.5" fill="#fff" />
    <circle cx="1100" cy="180" r="1.5" fill="#fff" />

    <circle cx="100" cy="300" r="1.5" fill="#fff" />
    <circle cx="200" cy="300" r="1.5" fill="#fff" />
    <circle cx="300" cy="300" r="1.5" fill="#fff" />
    <circle cx="400" cy="300" r="1.5" fill="#fff" />
    <circle cx="500" cy="300" r="1.5" fill="#fff" />
    <circle cx="600" cy="300" r="1.5" fill="#fff" />
    <circle cx="700" cy="300" r="1.5" fill="#fff" />
    <circle cx="800" cy="300" r="1.5" fill="#fff" />
    <circle cx="900" cy="300" r="1.5" fill="#fff" />
    <circle cx="1000" cy="300" r="1.5" fill="#fff" />
    <circle cx="1100" cy="300" r="1.5" fill="#fff" />
  </g>

  <!-- Ambient Glow Blobs -->
  <circle cx="200" cy="120" r="130" fill="#6366f1" opacity="0.25" filter="url(#glow)">
    <animate attributeName="cx" values="200;230;200" dur="6s" repeatCount="indefinite" />
  </circle>
  <circle cx="1000" cy="220" r="140" fill="#ec4899" opacity="0.2" filter="url(#glow)">
    <animate attributeName="cy" values="220;190;220" dur="7s" repeatCount="indefinite" />
  </circle>

  <!-- Animated Sound Equalizer / Audio Wave bars in background -->
  <g transform="translate(100, 240)" opacity="0.7">
    <rect x="0" y="-30" width="8" height="60" rx="4" fill="url(#waveGrad)">
      <animate attributeName="height" values="30;70;40;80;30" dur="1.8s" repeatCount="indefinite" />
      <animate attributeName="y" values="-15;-35;-20;-40;-15" dur="1.8s" repeatCount="indefinite" />
    </rect>
    <rect x="18" y="-45" width="8" height="90" rx="4" fill="url(#waveGrad)">
      <animate attributeName="height" values="90;40;100;50;90" dur="2.1s" repeatCount="indefinite" />
      <animate attributeName="y" values="-45;-20;-50;-25;-45" dur="2.1s" repeatCount="indefinite" />
    </rect>
    <rect x="36" y="-20" width="8" height="40" rx="4" fill="url(#waveGrad)">
      <animate attributeName="height" values="40;85;30;75;40" dur="1.6s" repeatCount="indefinite" />
      <animate attributeName="y" values="-20;-42;-15;-37;-20" dur="1.6s" repeatCount="indefinite" />
    </rect>
    <rect x="54" y="-50" width="8" height="100" rx="4" fill="url(#waveGrad)">
      <animate attributeName="height" values="100;60;110;45;100" dur="2.4s" repeatCount="indefinite" />
      <animate attributeName="y" values="-50;-30;-55;-22;-50" dur="2.4s" repeatCount="indefinite" />
    </rect>
    <rect x="72" y="-35" width="8" height="70" rx="4" fill="url(#waveGrad)">
      <animate attributeName="height" values="70;100;50;90;70" dur="1.9s" repeatCount="indefinite" />
      <animate attributeName="y" values="-35;-50;-25;-45;-35" dur="1.9s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Right Side Audio Wave Bars -->
  <g transform="translate(1010, 240)" opacity="0.7">
    <rect x="0" y="-35" width="8" height="70" rx="4" fill="url(#waveGrad)">
      <animate attributeName="height" values="70;100;45;85;70" dur="2.2s" repeatCount="indefinite" />
      <animate attributeName="y" values="-35;-50;-22;-42;-35" dur="2.2s" repeatCount="indefinite" />
    </rect>
    <rect x="18" y="-55" width="8" height="110" rx="4" fill="url(#waveGrad)">
      <animate attributeName="height" values="110;50;95;60;110" dur="1.7s" repeatCount="indefinite" />
      <animate attributeName="y" values="-55;-25;-47;-30;-55" dur="1.7s" repeatCount="indefinite" />
    </rect>
    <rect x="36" y="-25" width="8" height="50" rx="4" fill="url(#waveGrad)">
      <animate attributeName="height" values="50;80;35;90;50" dur="2.3s" repeatCount="indefinite" />
      <animate attributeName="y" values="-25;-40;-17;-45;-25" dur="2.3s" repeatCount="indefinite" />
    </rect>
    <rect x="54" y="-40" width="8" height="80" rx="4" fill="url(#waveGrad)">
      <animate attributeName="height" values="80;40;100;60;80" dur="1.9s" repeatCount="indefinite" />
      <animate attributeName="y" values="-40;-20;-50;-30;-40" dur="1.9s" repeatCount="indefinite" />
    </rect>
    <rect x="72" y="-20" width="8" height="40" rx="4" fill="url(#waveGrad)">
      <animate attributeName="height" values="40;65;30;70;40" dur="2.0s" repeatCount="indefinite" />
      <animate attributeName="y" values="-20;-32;-15;-35;-20" dur="2.0s" repeatCount="indefinite" />
    </rect>
  </g>

  <!-- Dynamic Central Graphic: Microphone & Broadcast Waves -->
  <g transform="translate(600, 110)">
    <!-- Broadcast Animated Radar Rings -->
    <circle cx="0" cy="0" r="45" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6">
      <animate attributeName="r" values="40;75;40" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.7;0.1;0.7" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="60" fill="none" stroke="#818cf8" stroke-width="1.5" opacity="0.4">
      <animate attributeName="r" values="55;95;55" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.5;0;0.5" dur="4s" repeatCount="indefinite" />
    </circle>
    <circle cx="0" cy="0" r="75" fill="none" stroke="#c084fc" stroke-width="1" opacity="0.3">
      <animate attributeName="r" values="70;115;70" dur="4s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.4;0;0.4" dur="4s" repeatCount="indefinite" />
    </circle>

    <!-- Microphone Icon Core -->
    <g filter="url(#glow)">
      <!-- Outer badge backing -->
      <circle cx="0" cy="0" r="38" fill="#1e293b" stroke="url(#textGrad)" stroke-width="2.5" />
      <!-- Mic Shape -->
      <rect x="-9" y="-18" width="18" height="26" rx="9" fill="url(#textGrad)" />
      <!-- Mic Stand Arc -->
      <path d="M -15 -4 C -15 14, 15 14, 15 -4" fill="none" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
      <!-- Mic Stem & Base -->
      <line x1="0" y1="14" x2="0" y2="24" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
      <line x1="-10" y1="24" x2="10" y2="24" stroke="#f8fafc" stroke-width="2.5" stroke-linecap="round" />
    </g>
  </g>

  <!-- Title & Text Content -->
  <g text-anchor="middle">
    <!-- Category Pill -->
    <g transform="translate(600, 205)">
      <rect x="-140" y="-14" width="280" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="1.2" opacity="0.9" />
      <circle cx="-118" cy="0" r="4" fill="#38bdf8">
        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="5" y="5" text-anchor="middle" class="tag">🎙️ PODCAST HOSTING &amp; ECOSYSTEM</text>
    </g>

    <!-- Main Title -->
    <text x="600" y="270" class="title">Awesome Podcast Hosting</text>
    <!-- Subtitle -->
    <text x="600" y="308" class="subtitle">Curated SaaS Platforms, Self-Hosted Servers, RSS Publishing &amp; Tools</text>
  </g>

  <!-- Live Status Beacon -->
  <g transform="translate(1120, 40)">
    <circle cx="0" cy="0" r="6" fill="#10b981" />
    <circle cx="0" cy="0" r="10" fill="none" stroke="#10b981" stroke-width="1.5" opacity="0.6">
      <animate attributeName="r" values="6;16;6" dur="2s" repeatCount="indefinite" />
      <animate attributeName="opacity" values="0.8;0;0.8" dur="2s" repeatCount="indefinite" />
    </circle>
  </g>
</svg>
